name: Pull Request Verification

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  check-flake:
    if: github.event.pull_request.draft == false
    name: Check Flake
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix flake check # --all-systems --keep-going --show-trace

  validate:
    runs-on: ubuntu-latest

    needs:
      - check-flake

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix run .#nix-develop .#workflow
      - run: pnpm install

      - run: ./node_modules/.bin/tsc --build

      - run: ./node_modules/.bin/rolldown -c rolldown.config.js

      - run: rm -rf fixtures/output && node packages/cli/dist/index.js fixtures/maegi.yml
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}

      - run: git diff --exit-code

  biome:
    if: github.event.pull_request.draft == false
    name: Biome
    runs-on: ubuntu-latest

    needs:
      - check-flake

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix run .#nix-develop .#workflow

      - run: biome ci .
